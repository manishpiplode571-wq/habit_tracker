{% extends "base.html" %}

{% block title %}Edit Habit{% endblock %}

{% block content %}

    <h1>✏️ Edit Habit</h1>

    <form method="POST">
        <div class="form-group">
            <label>Habit Name:</label>
            <input type="text" name="name" value="{{ habit['name'] }}" autofocus>
        </div>
        <button type="submit" class="btn btn-success">Update Habit</button>
    </form>

    <a href="/" class="back-link">← Back to Habits</a>

{% endblock %}
