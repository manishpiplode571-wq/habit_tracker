{% extends "base.html" %}

{% block title %}Add Habit{% endblock %}

{% block content %}

    <h1>➕ Add New Habit</h1>

    <form method="POST">
        <div class="form-group">
            <label>Habit Name:</label>
            <input type="text" name="name" placeholder="e.g. Reading, Exercise, Meditation" autofocus>
        </div>
        <button type="submit" class="btn btn-success">Add Habit</button>
    </form>

    <a href="/" class="back-link">← Back to Habits</a>

{% endblock %}
